[workspace]
resolver = "2"
members = ["crates/somadoc-core", "crates/somadoc-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["The somadoc-engine Authors"]
repository = "https://github.com/zhanghuanhuan303/somadoc-engine"
homepage = "https://github.com/zhanghuanhuan303/somadoc-engine"
keywords = ["markdown", "typst", "pdf", "typesetting", "publish"]
categories = ["text-processing", "rendering"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
base64 = "0.22"
serde_yaml = "0.9"
mdxport = { version = "0.3.2", default-features = false }
typst = "0.13"
typst-svg = "0.13"
typst-pdf = "0.13"
typst-assets = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
