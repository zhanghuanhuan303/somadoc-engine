name: Feature request
description: Suggest a new capability or an improvement for somadoc-engine.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today? Describe the use case rather than only the missing API.
      placeholder: |
        I write technical documents with a lot of numbered equations, and the current
        output numbers them inconsistently.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen? If you have an API shape, template variable, or Markdown syntax in mind, sketch it here.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, workarounds you use today, or existing tools that handle this well.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that helps — sample documents, links, or screenshots. This is optional.
    validations:
      required: false
